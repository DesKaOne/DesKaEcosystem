name: DesKaProvider CI

on:
  push:
    branches:
      - main
      - "dev/**"
    paths:
      - "DesKaProvider/**"
      - ".github/workflows/deskaprovider.yml"

  pull_request:
    branches:
      - main
      - "dev/**"
    paths:
      - "DesKaProvider/**"
      - ".github/workflows/deskaprovider.yml"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: deskaprovider
          POSTGRES_PASSWORD: deskaprovider
          POSTGRES_DB: deskaprovider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U deskaprovider -d deskaprovider_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    defaults:
      run:
        working-directory: DesKaProvider/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true
          cache-dependency-path: DesKaProvider/backend/go.mod

      - name: Tidy
        run: go mod tidy

      - name: Test
        env:
          DESKAPROVIDER_POSTGRES_DSN: postgres://deskaprovider:deskaprovider@localhost:5432/deskaprovider_test?sslmode=disable
        run: go test ./...

      - name: Vet
        run: go vet ./...

  race:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: deskaprovider
          POSTGRES_PASSWORD: deskaprovider
          POSTGRES_DB: deskaprovider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U deskaprovider -d deskaprovider_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    defaults:
      run:
        working-directory: DesKaProvider/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true
          cache-dependency-path: DesKaProvider/backend/go.mod

      - name: Race test
        env:
          DESKAPROVIDER_POSTGRES_DSN: postgres://deskaprovider:deskaprovider@localhost:5432/deskaprovider_test?sslmode=disable
        run: go test -race ./...
