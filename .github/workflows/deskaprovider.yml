name: DesKaProvider CI

on:
  push:
    branches:
      - main
      - "dev/**"
    paths:
      - "DesKaProvider/**"
      - ".github/workflows/deskaprovider.yml"

  pull_request:
    branches:
      - main
      - "dev/**"
    paths:
      - "DesKaProvider/**"
      - ".github/workflows/deskaprovider.yml"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DesKaProvider/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true
          cache-dependency-path: DesKaProvider/backend/go.mod

      - name: Tidy
        run: go mod tidy

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  race:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DesKaProvider/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true
          cache-dependency-path: DesKaProvider/backend/go.mod

      - name: Race test
        run: go test -race ./...
