name: IndoChain CI

on:
  push:
    branches:
      - main
      - "dev/**"

  pull_request:
    branches:
      - main
      - "dev/**"
    paths:
      - "IndoChain/**"
      - ".github/workflows/indochain.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: IndoChain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Format check
        run: |
          files="$(gofmt -l .)"

          if [ -n "$files" ]; then
            echo "::error::Files requiring gofmt:"
            printf '%s\n' "$files"
            exit 1
          fi

          echo "All Go files are properly formatted."

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...