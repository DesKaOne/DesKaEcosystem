name: DesKaOne CI

on:
  push:
    branches:
      - main
      - "dev/**"

  pull_request:
    branches:
      - main
      - "dev/**"
    paths:
      - "DesKaCash/**"
      - ".github/workflows/deskaone.yml"

jobs:
  deskacash:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deskacash
          POSTGRES_PASSWORD: deskacash
          POSTGRES_DB: deskacash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deskacash -d deskacash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: DesKaCash/backend

    env:
      DESKACASH_TEST_DATABASE_URL: postgres://deskacash:deskacash@localhost:5432/deskacash?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: DesKaCash/backend/go.mod

      - name: Tidy
        run: go mod tidy

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
