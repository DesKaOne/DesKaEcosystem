name: DesKaOne CI

on:
  push:
    branches:
      - main
      - "dev/**"

  pull_request:
    branches:
      - main
      - "dev/**"
    paths:
      - "DesKaCash/**"
      - ".github/workflows/deskaone.yml"

jobs:
  deskacash:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DesKaCash/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: DesKaCash/backend/go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
